## 5-HTP MD（云端 weste，完成 2026-07-31 深夜）
- **服务器**：weste RTX 6000D 85GB（bjb2 已释放，skill 已更新）@ :42207
- **协议**：md_v13.py（8 化合物原始协议：HMR + barostat always-on + 2fs production）
- **关键修复**：md_v8_simple.py NPT 崩（addForce(barostat)+reinitialize 时序 bug）→ 改用 v13（barostat 从一开始就加）。5HTP 平移坐标到 Vina 结合位点（原 RDKit 嵌入在蛋白内 clash 0.08Å）。
- **状态**：4fs production 崩（~7帧 NaN）→ 2fs HBonds 崩 11.2ns、2fs AllBonds 崩 8ns、v8 无HMR 崩 NPT → **三种协议全崩 = 纯数值不稳定**（GAFF2 极性 H），与配体结合无关。
- **结果（成功，RAW PBC 方法确认）**：11.2ns 轨迹显示 5-HTP **100% 时间结合 biotin 位点**——min dist 0.175±0.010Å，每帧 27.8 接触（28 原子全在蛋白 4Å 内），内部 RMSD 0.49Å（9 化合物中最低）。从未逃逸。
- **重要教训**：(a) 配体位置必须 PBC 修正（image_molecules），否则镜像跳变误判逃逸；(b) **含大量水的 MD 轨迹禁用 superpose() 分析配体-蛋白距离**（会破坏距离），必须用 RAW 坐标 + PBC。
- **稿件整合完成**：正文 MD 段 + FigS15（docking + RMSD 双面板）更新，编译干净。描述正确无需改。
- **完整 20ns 重跑（已放弃为技术债）**：4 种配置全崩（HMR+HBonds 11.2ns、HMR+AllBonds 8ns、v8 NPT、1fs+AllBonds 1ns）→ 根因是 **5-HTP GAFF 参数在长轨迹中的数值不稳定**，非 pose/约束问题。11.2ns 已用 RAW-PBC 确认 100% 结合（min dist 0.175Å，27.8 接触/帧），稿件已诚实修正为"11.2ns production"并编译干净。**投稿无需完整 20ns**。
